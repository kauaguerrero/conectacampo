# fly.toml app configuration file generated for conectacampo-worker on 2026-07-28T20:26:01-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'conectacampo-worker'
primary_region = 'gru'

[build]
[env]
  AUTH_STATE_PATH = '/app/auth_state'
  CRON_TIMEZONE = 'America/Sao_Paulo'
  LOG_LEVEL = 'info'
  PORT = '8080'

[[mounts]]
  source = 'conectacampo_auth_state'
  destination = '/app/auth_state'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '30s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
