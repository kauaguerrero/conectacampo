# Gerado para o deploy do worker (WhatsApp/Baileys) no Fly.io.
# Troque "app" pelo nome escolhido no `fly launch` antes do primeiro deploy.
app = "conectacampo-worker"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  AUTH_STATE_PATH = "/app/auth_state"
  LOG_LEVEL = "info"
  CRON_TIMEZONE = "America/Sao_Paulo"

[[mounts]]
  source = "conectacampo_auth_state"
  destination = "/app/auth_state"

[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

  [[services.http_checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
